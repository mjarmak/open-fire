<div class="ticker-identity">
  <div class="ticker-symbol-line">
    <strong class="ticket-type-indicator">{{ result.symbol }}</strong>
  </div>
  <span>{{ result.name }}</span>
  <span>{{ result.region }} - {{ result.currency }}</span>
</div>
<div class="ticker-metrics stock-lookup-price-metrics">
  <span><small>Price</small>{{ formatPrice(result.indicators?.latestPrice) }}</span>
  @if (!isCryptoResult) {
    <span><small>Market Cap</small>{{ formatMarketCap(result.indicators?.marketCap) }}</span>
  }
</div>
<button type="button" class="stock-lookup-add-button" (click)="addResult()">Add</button>
