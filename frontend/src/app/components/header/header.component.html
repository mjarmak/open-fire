<header class="top-bar">
  <div class="top-left-panel">
    <button
      type="button"
      class="secondary icon-btn top-menu-button menu-action"
      title="Menu"
      aria-label="Open menu"
      aria-haspopup="dialog"
      [attr.aria-expanded]="menuOpen"
      (click)="openMenu()"
    ></button>
  </div>

  <div class="top-middle-panel" aria-label="OpenFIRE">
    <img
      class="brand-mark"
      src="openfire-logo-48.png"
      srcset="openfire-logo-48.png 1x, openfire-logo-96.png 2x"
      alt=""
      width="36"
      height="36"
    />
    <strong class="top-bar-title">OpenFIRE</strong>
  </div>

  <div class="connection-panel" [class.login-only]="!state.isLoggedIn">
    @if (state.isLoggedIn) {
      <button
        type="button"
        class="secondary icon-btn"
        (click)="searchStock.emit()"
        title="Search"
        aria-label="Search"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m16 16 4 4" />
        </svg>
      </button>
      <button
        type="button"
        class="secondary icon-btn alerts-btn app-tooltip app-tooltip-below"
        (click)="openAlerts.emit()"
        [attr.aria-label]="state.alertCount > 0 ? state.alertCount + ' active alerts' : 'Alerts'"
        [attr.data-tooltip]="state.alertCount > 0 ? state.alertCount + ' active alerts' : 'Alerts'"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" />
          <path d="M9 17a3 3 0 0 0 6 0" />
        </svg>
        @if (state.alertCount > 0) {
          <span class="alert-badge">{{ state.alertCount > 99 ? '99+' : state.alertCount }}</span>
        }
      </button>
    } @else {
      @if (!state.isLoading) {
        <button
          type="button"
          (click)="openLogin.emit()"
        >
          Login
        </button>
        <button
          type="button"
          class="secondary"
          (click)="openCreateUser.emit()"
        >
          Create user
        </button>
      }
    }
  </div>
</header>

@if (menuOpen) {
  <div class="modal-backdrop top-menu-backdrop" role="presentation">
    <section class="edit-dialog top-menu-dialog" role="dialog" aria-modal="true" aria-labelledby="top-menu-title" (click)="$event.stopPropagation()">
      <div class="dialog-heading">
        <h2 id="top-menu-title">Menu</h2>
        <button type="button" class="icon-action" title="Close" aria-label="Close menu" (click)="closeMenu()"></button>
      </div>

      <div class="top-menu-dialog-actions">
        <button type="button" class="secondary top-menu-action" (click)="selectTheme()">
          @if (state.themeMode === 'dark') {
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          }
          <span>{{ state.themeToggleLabel }}</span>
        </button>

        <button type="button" class="secondary top-menu-action" (click)="selectFeedback()">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
            <path d="M8 9h8" />
            <path d="M8 13h5" />
          </svg>
          <span>Send Feedback</span>
        </button>

        <a
          class="secondary top-menu-action github-menu-action"
          href="https://github.com/mjarmak/open-fire"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View OpenFIRE source code on GitHub (opens in a new tab)"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M12 2A10 10 0 0 0 8.8 21.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 0 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.4 9.4 0 0 1 5.1 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.8-2.3 4.6-4.6 4.9.4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2Z" />
          </svg>
          <span>Open Source Code</span>
        </a>

        @if (state.isLoggedIn) {
          <button type="button" class="secondary top-menu-action" (click)="selectApiTokens()">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2v4" />
              <path d="M12 18v4" />
              <path d="m4.93 4.93 2.83 2.83" />
              <path d="m16.24 16.24 2.83 2.83" />
              <path d="M2 12h4" />
              <path d="M18 12h4" />
              <path d="m4.93 19.07 2.83-2.83" />
              <path d="m16.24 7.76 2.83-2.83" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span>API Tokens</span>
          </button>

          <button
            type="button"
            class="secondary top-menu-action"
            (click)="selectRefresh()"
            [disabled]="state.isLoading"
            [class.button-loading]="state.isLoading"
            [attr.aria-busy]="state.isLoading ? 'true' : null"
          >
            @if (state.isLoading) {
              <svg class="spinner-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke-dasharray="30 10" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.5 2v6h-6" />
                <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l.57.81" />
              </svg>
            }
            <span>Refresh Dashboard</span>
          </button>

          <button type="button" class="secondary top-menu-action" (click)="selectLogout()">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Logout</span>
          </button>
        }
      </div>

      <div class="dialog-actions">
        <button type="button" class="secondary" (click)="closeMenu()">Cancel</button>
      </div>
    </section>
  </div>
}
