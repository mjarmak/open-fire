services:
  open_fire_backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE or use an OpenFIRE deploy script}
    container_name: open_fire_backend
    restart: always
    env_file:
      - ${APP_ENV_FILE}
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      SERVER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-*}
    expose:
      - "${BACKEND_CONTAINER_PORT:-8080}"
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"

  open_fire_frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE or use an OpenFIRE deploy script}
    container_name: open_fire_frontend
    restart: always
    depends_on:
      - open_fire_backend
    environment:
      BACKEND_HOST: open_fire_backend
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-80}:80"
