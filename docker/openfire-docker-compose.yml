services:
  open_fire_backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is set by scripts/deploy-linux.sh}
    container_name: open_fire_backend
    restart: always
    env_file:
      - ${APP_ENV_FILE}
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    expose:
      - "8180"

  open_fire_frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is set by scripts/deploy-linux.sh}
    container_name: open_fire_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
