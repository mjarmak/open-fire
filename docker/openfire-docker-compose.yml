services:
  open_fire_backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is set by scripts/deploy-linux.sh}
    container_name: open_fire_backend
    restart: always
    env_file:
      - ${APP_ENV_FILE}
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SERVER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-*}
    expose:
      - "${BACKEND_CONTAINER_PORT:-8080}"
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"

  open_fire_frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is set by scripts/deploy-linux.sh}
    container_name: open_fire_frontend
    restart: always
    depends_on:
      - open_fire_backend
    environment:
      BACKEND_HOST: open_fire_backend
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-80}:80"
